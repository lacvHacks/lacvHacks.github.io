  <script>
    (function () {
      const LANG_KEY = 'site-lang';
      const LANGS = [
        { code: 'EN', label: 'EN🇺🇸' },
        { code: 'CN', label: 'CN🇨🇳' },
        { code: 'ES', label: 'ES🇪🇸' },
        { code: 'IT', label: 'IT🇮🇹' },
        { code: 'AR', label: 'AR🇸🇦' },
        { code: 'FR', label: 'FR🇫🇷' },
        { code: 'PT', label: 'PT🇧🇷' },
        { code: 'RU', label: 'RU🇷🇺' },
        { code: 'JA', label: 'JA🇯🇵' },
        { code: 'KO', label: 'KO🇰🇷' },
        { code: 'NL', label: 'NL🇧🇪' },
        { code: 'CA', label: 'CA🏴‍☠️' }
      ];

      function renderButtons() {
        return LANGS.map(l => `<button data-lang="${l.code}">${l.label}</button>`).join('');
      }

      function attachHandlers(menu) {
        const buttons = menu.querySelectorAll('button[data-lang]');
        const saved = localStorage.getItem(LANG_KEY) || 'EN';
        buttons.forEach(b => {
          b.classList.toggle('active', b.dataset.lang === saved);
          if (!b._langHandlerAttached) {
            b.addEventListener('click', () => {
              buttons.forEach(x => x.classList.remove('active'));
              b.classList.add('active');
              localStorage.setItem(LANG_KEY, b.dataset.lang);
              window.dispatchEvent(new CustomEvent('site-language-changed', { detail: b.dataset.lang }));
            });
            b._langHandlerAttached = true;
          }
        });
      }

      function ensureLanguages() {
        const menu = document.querySelector('.languages-menu');
        if (!menu) return;
        const existing = menu.querySelectorAll('button[data-lang]').length;
        if (existing !== LANGS.length) {
          menu.innerHTML = renderButtons();
        }
        attachHandlers(menu);
        // Make sure menu is visible to script (CSS controls final show/hide)
        menu.style.display = menu.style.display || 'flex';
      }

      // Observe DOM changes and ensure our languages are present when header is (React may overwrite)
      const observer = new MutationObserver((mutations) => {
        ensureLanguages();
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Initial attempts
      document.addEventListener('DOMContentLoaded', () => {
        ensureLanguages();
        setTimeout(ensureLanguages, 500);
      });
      // Also try on load in case script is injected after
      setTimeout(ensureLanguages, 800);
    })();
  </script>
